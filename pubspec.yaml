name: ai_research_assistant
description: "AI-powered Document Intelligence & Research Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1

  # Supabase (configured in Phase 6, added now so imports resolve)
  supabase_flutter: ^2.9.0

  # UI Enhancements
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.20.2
  file_picker: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
